name: Build BRMIS for GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brmis-pages
  cancel-in-progress: true

jobs:
  mirror-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mirror current BRMIS site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mirror pages-dist
          mkdir -p mirror pages-dist

          wget             --recursive             --level=2             --page-requisites             --convert-links             --adjust-extension             --no-parent             --domains=brmis-construtora.lovable.app             --directory-prefix=mirror             https://brmis-construtora.lovable.app/

          cp -a mirror/brmis-construtora.lovable.app/. pages-dist/
          touch pages-dist/.nojekyll
          test -f pages-dist/index.html

      - name: Publish gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pages-dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy BRMIS site"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
