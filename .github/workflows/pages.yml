name: Build BRMIS for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brmis-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          GITHUB_ACTIONS: "true"
          NITRO_PRESET: node-server
        run: bun run build

      - name: Prepare Pages output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-dist
          mkdir pages-dist

          if [ -f ".output/public/index.html" ]; then
            cp -a .output/public/. pages-dist/
          elif [ -f "dist/client/index.html" ]; then
            cp -a dist/client/. pages-dist/
          elif [ -f "dist/index.html" ]; then
            cp -a dist/. pages-dist/
          else
            echo "Static index.html was not generated."
            find . -maxdepth 4 -name index.html -print
            exit 1
          fi

          touch pages-dist/.nojekyll
          test -f pages-dist/index.html

      - name: Publish gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pages-dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy BRMIS site"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
